<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Champs — Your Smoke-Free Streak &amp; Victory Companion</title>
<meta name="description" content="Champs: Track your smoke-free streak with animated rewards, craving rescue, health milestones, and a lively mascot companion.">
<meta name="theme-color" content="#061514">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800;900&family=Syne:wght@700;800;900&display=swap" rel="stylesheet">

<style>
/* ============================================================
   DESIGN TOKENS
   ============================================================ */
:root {
  --bg:        #060f0e;
  --bg-2:      #0a1c1a;
  --bg-card:   rgba(14,38,35,.78);
  --bg-card-h: rgba(20,52,48,.92);
  --ink:       #eef8f4;
  --muted:     #7a9e98;
  --teal:      #14b8a6;
  --teal-g:    rgba(20,184,166,.4);
  --mint:      #2dd4bf;
  --mint-l:    #99f6e4;
  --gold:      #f59e0b;
  --gold-g:    rgba(245,158,11,.4);
  --amber:     #d97706;
  --coral:     #f87171;
  --coral-g:   rgba(248,113,113,.4);
  --violet:    #a78bfa;
  --violet-g:  rgba(167,139,250,.3);
  --line:      rgba(45,212,191,.14);
  --line-s:    rgba(45,212,191,.3);
  --r-xl:      28px;
  --r-lg:      20px;
  --r-md:      13px;
  --shadow:    0 16px 40px -10px rgba(0,0,0,.55),0 0 0 1px var(--line);
  --shadow-h:  0 24px 52px -10px rgba(20,184,166,.28),0 0 0 1px var(--mint);
}

/* ============================================================
   BASE RESET
   ============================================================ */
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth;-webkit-text-size-adjust:100%}
body{
  font-family:'Plus Jakarta Sans',system-ui,-apple-system,sans-serif;
  font-size:16px;line-height:1.55;
  background:var(--bg);
  background-image:
    radial-gradient(ellipse 80% 60% at 10% 10%,rgba(20,184,166,.16) 0%,transparent 55%),
    radial-gradient(ellipse 60% 50% at 90% 90%,rgba(245,158,11,.12) 0%,transparent 50%),
    radial-gradient(ellipse 50% 40% at 50% 50%,rgba(10,28,26,.9) 0%,transparent 100%);
  background-attachment:fixed;
  color:var(--ink);
  min-height:100vh;
  padding-bottom:100px;
  overflow-x:hidden;
}

canvas#fx{position:fixed;inset:0;pointer-events:none;z-index:200}
canvas#bg-canvas{position:fixed;inset:0;pointer-events:none;z-index:0;opacity:.55}

/* ============================================================
   TYPOGRAPHY
   ============================================================ */
h1,h2,h3,.disp{
  font-family:'Syne','Plus Jakarta Sans',sans-serif;
  font-weight:800;
  letter-spacing:-0.025em;
  line-height:1.08;
}
a{color:inherit;text-decoration:none}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none;outline:none;
  transition:transform .22s cubic-bezier(.16,1,.3,1),background .22s,box-shadow .22s,border-color .22s,opacity .22s}
button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid var(--gold);outline-offset:3px}
[hidden]{display:none!important}

/* ============================================================
   LAYOUT
   ============================================================ */
.wrap{max-width:1120px;margin:0 auto;padding:28px 20px;position:relative;z-index:2}

/* ============================================================
   TOPBAR
   ============================================================ */
.top{
  position:sticky;top:0;z-index:100;
  background:rgba(6,15,14,.88);
  backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);
  border-bottom:1px solid var(--line);
}
.top-in{
  max-width:1120px;margin:0 auto;
  padding:12px 20px;
  display:flex;align-items:center;justify-content:space-between;gap:16px;
}
.brand{
  display:flex;align-items:center;gap:10px;
  font-family:'Syne',sans-serif;font-size:24px;font-weight:900;
  color:#fff;letter-spacing:-.03em;cursor:pointer;
  user-select:none;-webkit-user-select:none;
  flex-shrink:0;
}
.brand-icon{width:34px;height:34px;filter:drop-shadow(0 0 10px var(--gold-g));animation:floatCrown 4s ease-in-out infinite}
@keyframes floatCrown{0%,100%{transform:translateY(0) rotate(-2deg)}50%{transform:translateY(-5px) rotate(3deg)}}
.brand-pill{
  font-size:10px;font-weight:900;letter-spacing:.07em;text-transform:uppercase;
  background:linear-gradient(135deg,var(--gold),var(--amber));
  color:#060f0e;padding:3px 8px;border-radius:99px;
}

.nav-tabs{
  display:flex;align-items:center;
  background:rgba(14,38,35,.65);
  border:1px solid var(--line);border-radius:999px;
  padding:5px;gap:3px;
  flex:1;max-width:480px;
}
.nav-tabs button{
  flex:1;padding:9px 14px;border-radius:999px;
  font-size:13px;font-weight:700;color:var(--muted);
  display:flex;align-items:center;justify-content:center;gap:6px;
  white-space:nowrap;
}
.nav-tabs button:hover{color:var(--ink);background:rgba(255,255,255,.07)}
.nav-tabs button[aria-selected="true"]{
  background:linear-gradient(135deg,var(--teal),#0d9488);
  color:#fff;
  box-shadow:0 4px 16px var(--teal-g);
}
.top-btns{display:flex;gap:8px;align-items:center;flex-shrink:0}
.icon-btn{
  width:42px;height:42px;border-radius:50%;
  background:var(--bg-card);border:1px solid var(--line);
  display:grid;place-content:center;font-size:18px;
  transition:transform .22s,border-color .22s,box-shadow .22s;
}
.icon-btn:hover{transform:translateY(-2px) scale(1.08);border-color:var(--mint);box-shadow:0 0 18px var(--teal-g)}

/* ============================================================
   TABS / PANES
   ============================================================ */
.pane{display:none}
.pane.on{display:block;animation:paneFade .35s cubic-bezier(.16,1,.3,1) forwards}
@keyframes paneFade{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:translateY(0)}}

/* ============================================================
   HERO — RING + GREETING
   ============================================================ */
.hero{
  background:linear-gradient(135deg,rgba(14,42,38,.97),rgba(7,22,20,.99));
  border:1px solid var(--line-s);
  box-shadow:var(--shadow),inset 0 1px 0 rgba(255,255,255,.06);
  border-radius:var(--r-xl);
  padding:36px 34px;
  display:grid;
  grid-template-columns:280px 1fr;
  gap:36px;align-items:center;
  position:relative;overflow:hidden;
  margin-bottom:24px;
}
.hero::before{
  content:'';position:absolute;
  top:-100px;right:-100px;
  width:400px;height:400px;border-radius:50%;
  background:radial-gradient(circle,rgba(20,184,166,.3) 0%,transparent 70%);
  pointer-events:none;
  animation:heroGlow 7s ease-in-out infinite alternate;
}
.hero::after{
  content:'';position:absolute;
  bottom:-80px;left:15%;
  width:280px;height:280px;border-radius:50%;
  background:radial-gradient(circle,rgba(245,158,11,.14) 0%,transparent 70%);
  pointer-events:none;
}
@keyframes heroGlow{0%{opacity:.7;transform:scale(.9) translate(0,0)}100%{opacity:1;transform:scale(1.2) translate(-30px,20px)}}

/* Ring */
.ringbox{position:relative;width:100%;max-width:280px;aspect-ratio:1;margin:0 auto}
.ringbox svg{width:100%;height:100%;transform:rotate(-90deg);overflow:visible}
circle{fill:none;stroke-linecap:round}
.rbg{stroke:rgba(255,255,255,.07);stroke-width:18}
.rfg{
  stroke:url(#rGrad);stroke-width:18;
  stroke-dasharray:553;stroke-dashoffset:553;
  transition:stroke-dashoffset 2s cubic-bezier(.16,1,.3,1);
  filter:drop-shadow(0 0 10px rgba(20,184,166,.7));
}
.rmid{
  position:absolute;inset:0;display:flex;flex-direction:column;
  align-items:center;justify-content:center;text-align:center;
}
.rmid b{
  font-family:'Syne',sans-serif;font-size:clamp(64px,11vw,90px);font-weight:900;line-height:.95;
  background:linear-gradient(180deg,#fff 40%,var(--mint-l) 100%);
  -webkit-background-clip:text;-webkit-text-fill-color:transparent;
  filter:drop-shadow(0 4px 20px rgba(0,0,0,.4));
}
.rmid-lbl{color:var(--mint);font-size:11px;font-weight:800;text-transform:uppercase;letter-spacing:.1em;margin-top:4px}
.rmid-sub{color:var(--muted);font-size:12px;margin-top:2px}

/* Hero right side */
.hero-r{position:relative;z-index:1}

/* Champy banner */
.champy-strip{
  display:inline-flex;align-items:center;gap:12px;
  background:rgba(255,255,255,.05);border:1px solid var(--line);
  padding:9px 16px;border-radius:999px;
  cursor:pointer;user-select:none;-webkit-user-select:none;
  transition:all .3s cubic-bezier(.16,1,.3,1);
  margin-bottom:16px;
}
.champy-strip:hover{background:rgba(45,212,191,.12);border-color:var(--mint);transform:translateY(-2px) scale(1.02);box-shadow:0 0 22px var(--teal-g)}
.champy-face{
  width:40px;height:40px;flex-shrink:0;
  animation:champyWobble 3.5s ease-in-out infinite;
}
@keyframes champyWobble{0%,100%{transform:translateY(0) rotate(0)}25%{transform:translateY(-3px) rotate(-5deg)}75%{transform:translateY(2px) rotate(4deg)}}
.champy-face svg{width:100%;height:100%;filter:drop-shadow(0 2px 8px rgba(245,158,11,.5))}
.champy-text{font-size:13px;font-weight:700;color:#fff}
.wave{display:inline-block;transform-origin:70% 70%;animation:waveHand 2.2s ease-in-out infinite;font-size:16px;margin-right:4px}
@keyframes waveHand{0%,100%{transform:rotate(0)}15%{transform:rotate(18deg)}30%{transform:rotate(-12deg)}45%{transform:rotate(15deg)}60%{transform:rotate(0)}}
.champy-pill{font-size:10px;font-weight:800;text-transform:uppercase;letter-spacing:.05em;background:rgba(45,212,191,.18);color:var(--mint);padding:3px 8px;border-radius:99px}

.hero h1{font-size:clamp(26px,4vw,44px);color:#fff;margin-bottom:8px}
.hero h1 .gold{color:var(--gold);text-shadow:0 0 28px var(--gold-g)}
.hero-tag{color:#b8d8d2;font-size:16px;margin-bottom:22px;line-height:1.45;max-width:560px}

/* Clock */
.clock{display:flex;gap:10px;flex-wrap:wrap}
.clk{
  background:rgba(255,255,255,.06);border:1px solid var(--line);
  backdrop-filter:blur(10px);border-radius:var(--r-md);
  padding:12px 14px;min-width:70px;text-align:center;
  transition:transform .22s,border-color .22s,background .22s;
}
.clk:hover{transform:translateY(-3px);border-color:var(--mint);background:rgba(255,255,255,.1)}
.clk b{display:block;font-family:'Syne',sans-serif;font-size:28px;font-weight:800;color:#fff;font-variant-numeric:tabular-nums;line-height:1}
.clk small{display:block;color:var(--mint);font-size:10px;font-weight:800;text-transform:uppercase;letter-spacing:.08em;margin-top:4px}

/* ============================================================
   STAT CARDS
   ============================================================ */
.stats-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:16px;margin:22px 0}
.stat-card{
  background:var(--bg-card);backdrop-filter:blur(14px);
  border:1px solid var(--line);border-radius:var(--r-lg);
  padding:22px;position:relative;overflow:hidden;
  transition:transform .3s cubic-bezier(.16,1,.3,1),border-color .3s,background .3s,box-shadow .3s;
}
.stat-card:hover{transform:translateY(-5px);background:var(--bg-card-h);border-color:var(--mint);box-shadow:var(--shadow-h)}
.stat-card::after{content:'';position:absolute;top:0;right:0;width:90px;height:90px;background:radial-gradient(circle,var(--teal-g) 0%,transparent 70%);opacity:0;transition:opacity .3s;pointer-events:none}
.stat-card:hover::after{opacity:1}
.stat-icon{width:46px;height:46px;border-radius:12px;background:rgba(255,255,255,.07);border:1px solid var(--line);display:grid;place-content:center;font-size:22px;margin-bottom:14px;transition:transform .3s}
.stat-card:hover .stat-icon{transform:scale(1.12) rotate(-8deg)}
.stat-card b{display:block;font-family:'Syne',sans-serif;font-size:30px;font-weight:800;color:#fff;letter-spacing:-.02em;line-height:1.1}
.stat-card small{color:var(--muted);font-size:13px;font-weight:600;margin-top:4px;display:block}
.stat-trend{
  display:inline-flex;align-items:center;gap:5px;
  font-size:11px;font-weight:800;color:var(--mint);
  margin-top:10px;background:rgba(45,212,191,.12);
  padding:3px 10px;border-radius:99px;
}

/* ============================================================
   QUOTE BANNER
   ============================================================ */
.quote-banner{
  margin:20px 0;padding:20px 26px;border-radius:var(--r-lg);
  background:linear-gradient(135deg,rgba(245,158,11,.12),rgba(245,158,11,.04));
  border:1px solid rgba(245,158,11,.28);
  display:flex;align-items:center;gap:18px;
  box-shadow:0 10px 28px -10px rgba(245,158,11,.15);
  position:relative;overflow:hidden;
}
.q-spark{font-size:28px;flex-shrink:0;animation:sparkPulse 2.8s ease-in-out infinite}
@keyframes sparkPulse{0%,100%{transform:scale(1);filter:drop-shadow(0 0 2px var(--gold))}50%{transform:scale(1.2) rotate(12deg);filter:drop-shadow(0 0 14px var(--gold))}}
.quote-banner p{font-family:'Syne',sans-serif;font-size:18px;font-weight:700;color:#fff;line-height:1.4}
.q-author{display:block;font-family:'Plus Jakarta Sans',sans-serif;font-size:11px;font-weight:700;color:var(--gold);margin-top:5px;text-transform:uppercase;letter-spacing:.06em}

/* ============================================================
   CHECK-IN + CRAVING 2-COL
   ============================================================ */
.grid2{display:grid;grid-template-columns:1.3fr 1fr;gap:20px;margin-top:20px}

.card{
  background:var(--bg-card);backdrop-filter:blur(14px);
  border:1px solid var(--line);box-shadow:var(--shadow);
  border-radius:var(--r-xl);padding:28px;position:relative;overflow:hidden;
}
.card h2{font-size:24px;color:#fff;margin-bottom:8px}
.card p.sub{color:var(--muted);font-size:14px;margin-bottom:20px;line-height:1.5}

/* Moods */
.moods{display:flex;gap:10px;margin-bottom:18px}
.moods button{
  flex:1;padding:14px 4px;border-radius:var(--r-md);
  border:2px solid var(--line);background:rgba(255,255,255,.04);
  font-size:28px;text-align:center;
  transition:all .25s cubic-bezier(.16,1,.3,1);
}
.moods button small{display:block;font-size:11px;font-weight:700;color:var(--muted);margin-top:6px}
.moods button:hover{background:rgba(45,212,191,.08);border-color:var(--mint);transform:translateY(-2px)}
.moods button[aria-pressed="true"]{border-color:var(--teal);background:rgba(20,184,166,.18);transform:translateY(-5px);box-shadow:0 8px 22px var(--teal-g)}
.moods button[aria-pressed="true"] small{color:#fff}

/* 28-day heatmap */
.heat-hdr{display:flex;justify-content:space-between;align-items:center;margin:22px 0 10px}
.heat-hdr span{font-size:12px;font-weight:700;color:var(--muted)}
.heat{display:grid;grid-template-columns:repeat(7,1fr);gap:7px}
.heat i{
  aspect-ratio:1;border-radius:9px;
  background:rgba(255,255,255,.04);border:1px solid var(--line);
  display:grid;place-content:center;
  font-size:11px;font-style:normal;color:var(--muted);font-weight:600;
  cursor:pointer;transition:transform .18s,border-color .18s,box-shadow .18s;
  position:relative;
}
.heat i:hover{transform:scale(1.18);border-color:var(--mint);z-index:2}
.heat i.y{background:linear-gradient(135deg,var(--mint),var(--teal));color:#060f0e;font-weight:800;border-color:transparent;box-shadow:0 0 10px var(--teal-g)}
.heat i.t{outline:2.5px solid var(--gold);outline-offset:2px}

/* Craving card */
.crave-card{
  background:linear-gradient(140deg,rgba(239,68,68,.22),rgba(245,158,11,.12)),var(--bg-card);
  border:1px solid rgba(239,68,68,.32);
  box-shadow:0 16px 40px -12px rgba(239,68,68,.22);
  border-radius:var(--r-xl);padding:28px;
  display:flex;flex-direction:column;justify-content:space-between;
  position:relative;overflow:hidden;
}
.crave-card::before{
  content:'';position:absolute;top:-55px;right:-55px;
  width:200px;height:200px;border-radius:50%;
  background:radial-gradient(circle,rgba(248,113,113,.38) 0%,transparent 70%);
  animation:pulseSOS 3.5s ease-in-out infinite;pointer-events:none;
}
@keyframes pulseSOS{0%,100%{transform:scale(.88);opacity:.6}50%{transform:scale(1.22);opacity:1}}
.crave-hdr{display:flex;align-items:center;gap:12px;margin-bottom:8px}
.crave-dot{
  width:11px;height:11px;border-radius:50%;
  background:var(--coral);box-shadow:0 0 10px var(--coral);
  position:relative;flex-shrink:0;
}
.crave-dot::after{
  content:'';position:absolute;inset:-4px;border-radius:50%;
  border:2px solid var(--coral);animation:sosPing 1.6s ease-out infinite;
}
@keyframes sosPing{0%{transform:scale(1);opacity:.8}100%{transform:scale(2.2);opacity:0}}
.crave-card h2{font-size:24px;color:#fff}
.crave-card p{color:#fca5a5;font-size:14px;line-height:1.5;margin-bottom:22px}
.btn-sos{
  display:flex;align-items:center;justify-content:center;gap:8px;
  width:100%;padding:16px 20px;border-radius:999px;
  background:linear-gradient(135deg,#ef4444,#b91c1c);color:#fff;
  font-weight:800;font-size:15px;
  box-shadow:0 8px 24px rgba(239,68,68,.42);
  transition:all .25s;
}
.btn-sos:hover{box-shadow:0 12px 34px rgba(239,68,68,.65);transform:translateY(-2px) scale(1.02)}
.crave-foot{display:flex;justify-content:space-between;align-items:center;margin-top:18px;padding-top:14px;border-top:1px solid rgba(255,255,255,.09);font-size:13px;color:#fff}
.crave-foot b{font-size:20px;color:var(--gold)}

/* ============================================================
   BUTTONS
   ============================================================ */
.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:9px;
  padding:14px 26px;border-radius:999px;
  background:linear-gradient(135deg,var(--teal),#0d9488);
  color:#fff;font-weight:800;font-size:14px;
  box-shadow:0 6px 20px var(--teal-g);
  transition:all .25s cubic-bezier(.16,1,.3,1);
  cursor:pointer;user-select:none;-webkit-user-select:none;
}
.btn:hover{transform:translateY(-2px) scale(1.02);box-shadow:0 10px 28px rgba(20,184,166,.55);filter:brightness(1.08)}
.btn:active{transform:translateY(0) scale(.98)}
.btn.gold{background:linear-gradient(135deg,var(--gold),var(--amber));color:#060f0e;box-shadow:0 6px 22px var(--gold-g)}
.btn.gold:hover{box-shadow:0 10px 30px rgba(245,158,11,.58)}
.btn.ghost{background:rgba(255,255,255,.06);border:1px solid var(--line);color:#fff;box-shadow:none}
.btn.ghost:hover{background:rgba(255,255,255,.12);border-color:var(--mint)}
.btn.full{width:100%}
.btn.danger{background:linear-gradient(135deg,var(--coral),#b91c1c);color:#fff;box-shadow:0 6px 20px var(--coral-g)}
.btn[disabled]{opacity:.45;pointer-events:none}

/* ============================================================
   JOURNEY / TIMELINE
   ============================================================ */
.section-hdr{display:flex;justify-content:space-between;align-items:flex-end;margin-bottom:22px;flex-wrap:wrap;gap:12px}
.section-hdr h2{font-size:30px;color:#fff}
.section-hdr p{color:var(--muted);font-size:14px;margin-top:4px}

.ms-list{display:grid;gap:13px}
.ms-item{
  background:var(--bg-card);backdrop-filter:blur(14px);
  border:1px solid var(--line);border-radius:var(--r-lg);
  padding:20px 24px;position:relative;overflow:hidden;
  transition:all .3s cubic-bezier(.16,1,.3,1);
  cursor:default;
}
.ms-item:hover{transform:translateX(5px);border-color:var(--mint);background:var(--bg-card-h)}
.ms-item.done{border-color:rgba(45,212,191,.38);background:linear-gradient(135deg,rgba(20,184,166,.15),rgba(10,28,26,.9))}
.ms-item.done::before{content:'';position:absolute;left:0;top:0;bottom:0;width:5px;background:linear-gradient(180deg,var(--mint),var(--teal))}
.ms-item header{display:flex;justify-content:space-between;align-items:center;font-weight:800;font-size:17px;color:#fff;margin-bottom:6px;gap:10px;flex-wrap:wrap}
.ms-pill{font-size:11px;font-weight:800;padding:3px 10px;border-radius:99px;background:rgba(255,255,255,.08);color:var(--muted);white-space:nowrap}
.ms-item.done .ms-pill{background:rgba(45,212,191,.2);color:var(--mint)}
.ms-desc{color:var(--muted);font-size:13px;line-height:1.45;margin-bottom:12px}
.ms-bar{height:9px;border-radius:99px;background:rgba(255,255,255,.07);overflow:hidden;position:relative}
.ms-bar i{display:block;height:100%;border-radius:99px;background:linear-gradient(90deg,var(--teal),var(--mint));transition:width 1.5s cubic-bezier(.16,1,.3,1);box-shadow:0 0 10px var(--teal-g)}

/* ============================================================
   VAULT
   ============================================================ */
.vault-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(255px,1fr));gap:16px}
.vault-card{
  background:var(--bg-card);backdrop-filter:blur(14px);
  border:1px solid var(--line);border-radius:var(--r-lg);
  padding:22px;position:relative;overflow:hidden;
  transition:all .3s cubic-bezier(.16,1,.3,1);
}

<script>
'use strict';
/* ─────────── Utilities ────────── */
const $  = s => document.querySelector(s);
const $$ = s => [...document.querySelectorAll(s)];
const KEY = 'champs.v2';
const esc = t => String(t).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const dkey = d => new Date(d).toLocaleDateString('en-CA');
const clamp = (v,lo,hi) => Math.min(hi,Math.max(lo,v));
const sleep = ms => new Promise(r => setTimeout(r,ms));

/* ─────────── State ────────── */
let S = null;
try { S = JSON.parse(localStorage.getItem(KEY)); } catch(_){}

/* Migrate from old key */
if (!S) {
  try {
    const old = JSON.parse(localStorage.getItem('champs.v1'));
    if (old && old.quit) { S = old; localStorage.setItem(KEY, JSON.stringify(S)); }
  } catch(_){}
}

const save = () => { try { localStorage.setItem(KEY,JSON.stringify(S)); } catch(_){} };

/* ─────────── Audio ────────── */
let soundEnabled = true;
let _ctx = null;
function getCtx() {
  if (!_ctx) _ctx = new (window.AudioContext||window.webkitAudioContext)();
  if (_ctx.state === 'suspended') _ctx.resume();
  return _ctx;
}
function tone(freq, type='sine', dur=.15, vol=.1) {
  if (!soundEnabled) return;
  try {
    const c = getCtx(), o = c.createOscillator(), g = c.createGain();
    o.type = type; o.frequency.setValueAtTime(freq,c.currentTime);
    g.gain.setValueAtTime(vol,c.currentTime);
    g.gain.exponentialRampToValueAtTime(.0001,c.currentTime+dur);
    o.connect(g); g.connect(c.destination);
    o.start(); o.stop(c.currentTime+dur);
  } catch(_){}
}
const sfxPop     = () => { tone(400,'sine',.07,.14); setTimeout(()=>tone(760,'sine',.09,.1),35); };
const sfxSuccess = () => { [523,659,784].forEach((f,i)=>setTimeout(()=>tone(f,'sine',.2,.14),i*90)); };
const sfxFanfare = () => { [440,554,659,880].forEach((f,i)=>setTimeout(()=>tone(f,'triangle',.3,.16),i*95)); };
const sfxTick    = () => tone(880,'sine',.04,.06);

/* ─────────── Content Pools ────────── */
const TIPS = [
  "Drink a full glass of ice-cold water before reaching for anything. Cravings peak then fade in 3–5 minutes — every single time.",

/* ─────────── Statistics ────────── */
function stats() {
  const ms  = Math.max(0, Date.now() - new Date(S.quit).getTime());
  const d   = ms / 864e5;
  const cigs= (S.prev||0) + d * S.cpd;
  const money = cigs * (S.price / Math.max(1, S.perPack));
  const mins  = cigs * 11;
  return {ms, d, cigs, money, mins};
}
const fmtMoney = n => ['$','€','£'].includes(S.cur) ? S.cur+n.toFixed(2) : n.toFixed(2)+' '+S.cur;
const fmtTime  = m => m<60 ? Math.floor(m)+'m' : m<1440 ? Math.floor(m/60)+'h '+Math.floor(m%60)+'m' : Math.floor(m/1440)+'d '+Math.floor((m%1440)/60)+'h';

function ciStreak() {
  let n=0, d=new Date();
  if (!S.checkins[dkey(d)]) d.setDate(d.getDate()-1);
  while(S.checkins[dkey(d)]) { n++; d.setDate(d.getDate()-1); }
  return n;
}

/* ─────────── Tick ────────── */
let _tickRunning = false;
function tick(first) {
  if (!S || !$('#k-d')) return;
  const st = stats();
  const t  = Math.floor(st.ms/1000);

  $('#k-d').textContent = Math.floor(t/86400);
  $('#k-h').textContent = Math.floor((t%86400)/3600);
  $('#k-m').textContent = Math.floor((t%3600)/60);
  $('#k-s').textContent = t%60;
  $('#k-big').textContent = Math.floor(st.d);
  $('#v-c').textContent  = Math.floor(st.cigs).toLocaleString();
  $('#v-m').textContent  = fmtMoney(st.money);
  $('#v-t').textContent  = fmtTime(st.mins);

  const next = TARGETS.find(x=>x>st.d)||TARGETS.at(-1);
  const prev = [...TARGETS].reverse().find(x=>x<=st.d)||0;
  const prog = clamp((st.d-prev)/Math.max(1,next-prev),0,1);
  const circ = 2*Math.PI*88;
  const offset = circ*(1-Math.max(.03,prog));
  const ring = $('#ring');
  if (ring) {
    ring.style.strokeDasharray = circ;
    if (first) setTimeout(()=>{ if($('#ring')) $('#ring').style.strokeDashoffset=offset; },100);
    else ring.style.strokeDashoffset = offset;
  }
  S.best = Math.max(S.best||0, st.d);
}

/* ─────────── renderAll ────────── */
function renderAll() {
  renderToday();
  renderJourney();
  renderVault();
  renderBadges();
}

/* ─────────── Modal ────────── */
function openModal(html) {
  $('#sheet').innerHTML = html;
  $('#modal').hidden = false;
  $('#modal').querySelector('button,input,[tabindex]')?.focus();
}
function closeModal() {
  $('#modal').hidden = true;
  clearTimeout(window._bt);
  $('#sheet').innerHTML = '';
}
document.addEventListener('click', e => {
  if (e.target.id==='modal') closeModal();
  if (e.target.classList.contains('close-btn') || e.target.id==='close-modal') closeModal();
});
document.addEventListener('keydown', e => {
  if (e.key==='Escape' && !$('#modal').hidden) closeModal();
});

/* ─────────── Check-in ────────── */
function checkin(mood) {
  const k = dkey(new Date());
  let r;
  if (!S.checkins[k]) {
    const n = Object.keys(S.checkins).length;
    const type = ['msg','tip','joke'][n%3];
    const pool = POOL[type];
    r = {
      type,
      text: pool[(n*7 + Math.floor(Math.random()*3)) % pool.length],
      date: k,
      mood
    };
    S.checkins[k] = {mood, gift:r};
    S.vault = [...(S.vault||[]), r];
    save();
    renderAll();
    sfxSuccess();
  } else {
    r = S.checkins[k].gift || (S.vault||[]).at(-1);
  }
  if (r) openGiftModal(r);
}

function openGiftModal(r) {
  openModal(`
    <button class="close-btn" id="close-modal" aria-label="Close">✕</button>
    <h2 class="disp" id="modal-title">Your Daily Victory Gift 🎁</h2>
    <p style="color:var(--muted);font-size:13px;margin-bottom:4px">Tap the box to reveal your personal gift!</p>
    <div class="flip" id="gift-flip" tabindex="0" role="button" aria-label="Tap to open your gift">
      <div>
        <div class="f">
          <span class="gift-icon" aria-hidden="true">🎁</span>
          <span>Tap to Open!</span>
          <small>Made just for you</small>
        </div>
        <div class="b" aria-live="polite">
          <span class="chip ${r.type||'msg'}">${LABEL[r.type]||'🎁 Gift'}</span>
          <p>${esc(r.text)}</p>
          <small style="color:var(--mint);font-weight:700;margin-top:14px;display:block">✓ Saved to your Vault</small>
        </div>
      </div>
    </div>
    <button class="btn gold full" id="close-modal" style="margin-top:4px">Keep Winning, Champ 🚀</button>
  `);
  const fl = $('#gift-flip');
  const open = () => {
    if (!fl.classList.contains('open')) {
      sfxFanfare(); confetti();
      fl.classList.add('open');
    }
  };
  fl.addEventListener('click', open);
  fl.addEventListener('keydown', e => { if(e.key==='Enter'||e.key===' '){e.preventDefault();open();} });
}

/* ─────────── Craving Modal ────────── */
function openCravingModal() {
  sfxPop();
  const challenge = CHALLENGES[Math.floor(Math.random()*CHALLENGES.length)];

  openModal(`
    <button class="close-btn" id="close-modal" aria-label="Close">✕</button>
    <h2 class="disp" id="modal-title">Breathe. This Will Pass.</h2>
    <p style="color:var(--muted);font-size:13px;margin-bottom:4px">Follow the orb for 4-7-8 breathing, or pop all the bubbles below.</p>

    <div class="breath-wrap">
      <div class="orb-halo" aria-hidden="true">
        <div class="orb-ring"></div>
        <div class="orb" id="orb">🌬️</div>
      </div>
      <div class="breath-lbl" id="bl" aria-live="polite" role="status">Get ready…</div>
      <div class="breath-sub" id="bs">Follow the orb's rhythm</div>
    </div>

    <div style="margin-top:16px;border-top:1px solid var(--line);padding-top:16px">
      <b style="color:#fff;font-size:13px;display:block;margin-bottom:10px" id="bubble-label">Pop all 10 craving bubbles:</b>
      <div class="bubble-arena" id="bubble-arena" role="group" aria-label="Pop these bubbles">
        ${Array.from({length:10},(_,i)=>`
          <div class="bubble" role="button" tabindex="0" aria-label="Bubble ${i+1}" data-bi="${i}">💥</div>
        `).join('')}
      </div>
    </div>

    <p style="text-align:center;color:var(--muted);font-size:13px;margin:14px 0 16px">
      Or try: <b style="color:#fff">${esc(challenge)}</b>
    </p>
    <button class="btn ghost full" id="close-modal">I'm Better Now ✅</button>
  `);

  /* Bubble popping */
  let popped = 0;
  $$('.bubble').forEach(b => {
    const pop = () => {
      if (b.classList.contains('popped')) return;
      b.classList.add('popped');
      sfxPop();
      if (++popped===10) {
        sfxSuccess();
        confetti();
        const lbl = $('#bubble-label');
        if (lbl) lbl.textContent = '🏆 All bubbles crushed! Craving defeated!';
      }
    };
    b.addEventListener('click', pop);
    b.addEventListener('keydown', e => { if(e.key==='Enter'||e.key===' '){e.preventDefault();pop();} });
  });

  /* 4-7-8 Breathing */
  const phases = [
    ['Breathe In',  4, 1.45, 'Inhale slowly and deeply through your nose'],
    ['Hold',        7, 1.45, 'Hold calmly — your clean lungs are holding strong'],
    ['Breathe Out', 8, .70,  'Exhale fully — release all tension and craving']
  ];
  let cycle=0, idx=0;
  const runBreath = () => {
    const orb=$('#orb');
    if (!orb) return;
    if (cycle>=3) {
      const bl=$('#bl'),bs=$('#bs');
      if(bl) bl.textContent='You Beat It! 🏆';
      if(bs) bs.textContent='Your brain just overrode the craving.';
      S.cravings=(S.cravings||0)+1;
      save(); confetti(); sfxFanfare();
      renderToday(); renderBadges();
      return;
    }
    const p=phases[idx];
    const bl=$('#bl'),bs=$('#bs');
    if(bl) bl.textContent=p[0];
    if(bs) bs.textContent=p[3];
    orb.style.transitionDuration=(p[0]==='Hold'?'0':p[1])+'s';
    orb.style.transform=`scale(${p[2]})`;
    window._bt=setTimeout(()=>{ idx++; if(idx>2){idx=0;cycle++;} runBreath(); },p[1]*1000);
  };
  window._bt=setTimeout(runBreath,950);
}

  sfxPop();
  openModal(`

  $('#s-reset').addEventListener('click',()=>{
    if(confirm('This will erase all your data permanently. Are you sure?')){

/* ─────────── Share ────────── */
function buildShareText() {
  const st=stats();
  return `🏆 I'm ${Math.floor(st.d)} days smoke-free with Champs!\n`
       + `🚭 ${Math.floor(st.cigs).toLocaleString()} cigarettes skipped\n`
       + `💰 ${fmtMoney(st.money)} saved\n`

       + `✨ Staying smoke-free one day at a time!`;
}
function shareStreak() {
  try{
    navigator.clipboard.writeText(buildShareText());
    sfxSuccess();
    showToast('Streak badge copied to clipboard! 📋');
  } catch(_){ showToast('Could not copy — try long-pressing the text.'); }
}
function nativeShare() {
  navigator.share?.({title:'My Smoke-Free Streak', text:buildShareText()}).catch(()=>{});
}

/* ─────────── Confetti ────────── */
function confetti() {
  const c=$('#fx'); if(!c) return;
  const ctx=c.getContext('2d');
  c.width=innerWidth; c.height=innerHeight;
  const cols=['#f59e0b','#2dd4bf','#14b8a6','#f87171','#ffffff','#a78bfa'];
  const ps=Array.from({length:170},()=>({
    x:innerWidth*.5, y:innerHeight*.35,
    vx:(Math.random()-.5)*20, vy:Math.random()*-17-5,
    s:Math.random()*9+4, c:cols[Math.floor(Math.random()*cols.length)],
    r:Math.random()*6, shape:Math.random()>.5?'rect':'circle'
  }));
  let f=0;
  (function anim(){
    ctx.clearRect(0,0,c.width,c.height);
    ps.forEach(p=>{
      p.x+=p.vx; p.y+=p.vy; p.vy+=.4; p.r+=.2;
      ctx.save(); ctx.translate(p.x,p.y); ctx.rotate(p.r); ctx.fillStyle=p.c; ctx.globalAlpha=Math.max(0,1-f/120);
      if(p.shape==='circle'){ctx.beginPath();ctx.arc(0,0,p.s*.5,0,Math.PI*2);ctx.fill();}
      else ctx.fillRect(-p.s*.5,-p.s*.3,p.s,p.s*.6);
      ctx.restore();
    });
    if(++f<150) requestAnimationFrame(anim);
    else ctx.clearRect(0,0,c.width,c.height);
  })();
}

/* ─────────── Ambient Canvas ────────── */
function initBgCanvas() {
  const c=$('#bg-canvas'); if(!c) return;
  const ctx=c.getContext('2d');
  let w=c.width=innerWidth, h=c.height=innerHeight;
  window.addEventListener('resize',()=>{ w=c.width=innerWidth; h=c.height=innerHeight; });
  const pts=Array.from({length:40},()=>({
    x:Math.random()*w, y:Math.random()*h,
    r:Math.random()*1.8+.8,
    vx:(Math.random()-.5)*.25,
    vy:-(Math.random()*.3+.05),
    a:Math.random()*.45+.15,
    col:Math.random()>.4?'#2dd4bf':'#f59e0b'
  }));
  (function loop(){
    ctx.clearRect(0,0,w,h);
    pts.forEach(p=>{
      p.x+=p.vx; p.y+=p.vy;
      if(p.y<-4){p.y=h+4;} if(p.x<-4){p.x=w+4;} if(p.x>w+4){p.x=-4;}
      ctx.beginPath(); ctx.arc(p.x,p.y,p.r,0,Math.PI*2);
      ctx.fillStyle=p.col; ctx.globalAlpha=p.a; ctx.fill();
    });
    ctx.globalAlpha=1;
    requestAnimationFrame(loop);
  })();
}

/* ─────────── Demo Data ────────── */
function loadDemo() {
  const qd=new Date();
  qd.setDate(qd.getDate()-14); qd.setHours(qd.getHours()-8);
  const checkins={};
  for(let i=14;i>=0;i--){
    const d=new Date(); d.setDate(d.getDate()-i);
    const t=['tip','joke','msg'][i%3];
    const pool=POOL[t];
    checkins[dkey(d)]={mood:i%3, gift:{type:t, text:pool[i%pool.length], date:dkey(d)}};
  }
  S={
    name:'Champion Ayoub',
    quit:qd.toISOString(),
    cpd:15, perPack:20, price:10, cur:'DT',
    checkins,
    vault:Object.values(checkins).map(c=>c.gift),
    cravings:7, slips:[], prev:0, best:14
  };
  save();
  if($('#app').hidden) boot();
  else { renderAll(); sfxFanfare(); confetti(); showToast('14-day demo loaded! Explore all tabs!'); }
}

/* ─────────── Boot / Start ────────── */
let _started = false;
function boot() {
  if (_started) { renderAll(); return; }
  _started = true;
  $('#onb').hidden = true;
  $('#app').hidden = false;
  buildTabs();
  initBgCanvas();
  renderAll();

  /* Single interval guard */
  setInterval(()=>tick(false), 1000);
  setInterval(()=>{ save(); renderJourney(); renderBadges(); }, 60000);

  setTimeout(()=>showToast('👋 Hello Champion! Check me out — your streak is live!'), 900);
}

/* ─────────── Header Buttons (bound after DOM ready) ────────── */
$('#brand-btn').addEventListener('click', champyTalk);
$('#brand-btn').addEventListener('keydown', e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();champyTalk();}});
$('#sound-btn').addEventListener('click', ()=>{
  soundEnabled=!soundEnabled;
  $('#sound-btn').textContent=soundEnabled?'🔊':'🔇';
  if(soundEnabled) sfxPop();
});
$('#gear-btn').addEventListener('click', openSettings);

/* ─────────── Initial Boot ────────── */
if (S && S.quit) {
  boot();
} else {
  $('#onb').hidden = false;
  initBgCanvas();

  /* Set default quit time to now */
  const now=new Date();
  now.setMinutes(now.getMinutes()-now.getTimezoneOffset());
  $('#o-quit').value=now.toISOString().slice(0,16);

  $('#onb-form').addEventListener('submit', e=>{
    e.preventDefault();
    const name=$('#o-name').value.trim();
    if(!name){$('#o-name').focus();return;}
    S={
      name,
      quit:new Date($('#o-quit').value).toISOString(),
      cpd: Math.max(1,+$('#o-cpd').value||1),
      perPack: Math.max(1,+$('#o-pp').value||1),
      price: Math.max(0,+$('#o-price').value||0),
      cur: $('#o-cur').value||'$',
      checkins:{}, vault:[], cravings:0, slips:[], prev:0, best:0
    };
    save(); boot(); confetti(); sfxSuccess();
  });

  $('#o-demo').addEventListener('click', loadDemo);
}
